<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyllabusTube - Syllabus to Video Study Roadmap</title>
    <meta
      name="description"
      content="Convert syllabus documents into structured unit-by-unit YouTube study roadmaps."
    />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('syllabustube_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-app text-text-main antialiased selection:bg-accent-subtle selection:text-accent-main">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
